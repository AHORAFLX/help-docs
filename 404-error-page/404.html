<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@mdi/font@7.4.47/css/materialdesignicons.min.css">
    <link rel="stylesheet" href="/404/404-error.css">
</head>
<body>

    <div class="container">
        <div class="error-box">
            <p class="error-code">404</p>
            <h1 class="error-title">Page Not Found</h1>
            <p class="error-message">Sorry, the page you're looking for doesn't exist or has been moved.</p>
            <span onclick="goHome()" class="button" id="homeBtn">
                <span class="mdi mdi-home"></span>
                Return to Home Page
            </span>
        </div>
    </div>

    <script src="/404/404-error.js"></script>
</body>
</html>
